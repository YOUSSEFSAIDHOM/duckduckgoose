plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext {
    gdxVersion = '1.13.1'
}

repositories {
    mavenCentral()
}

sourceSets.main.resources.srcDirs += [rootProject.file('assets').path]

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'io.github.duckduckgoose.Lwjgl3Launcher'
}

tasks.named('run') {
    // On NixOS, libGL.so.1 (from libglvnd) isn't on the default library
    // path, so GLFW fails with "GLX: Failed to load GLX" without this.
    //
    //
    // The store has several libglvnd-1.7.0 builds from different
    // dependency closures; not all of them actually work here, so this
    // path is pinned to the one verified to load successfully rather than
    // picked automatically. If this breaks after a nixos-rebuild/channel
    // update, find a working one with:
    //   find /nix/store -maxdepth 1 -type d -iname '*-libglvnd-*' ! -iname '*-dev'

    def glvndLib = '/nix/store/adas3ix7v8zry5i1nqagc2j76y0ka7rx-libglvnd-1.7.0/lib'
    environment 'LD_LIBRARY_PATH', "/run/opengl-driver/lib:${glvndLib}:${System.getenv('LD_LIBRARY_PATH') ?: ''}"
}

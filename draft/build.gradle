plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext {
    gdxVersion = '1.13.1'
}

repositories {
    mavenCentral()
}

sourceSets.main.resources.srcDirs += [rootProject.file('assets').path]

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'io.github.duckduckgoose.Lwjgl3Launcher'
}

tasks.named('run') {
    // On NixOS the GL / GLFW native libraries aren't on the default loader
    // path, so GLFW fails with "GLX: Failed to load GLX" without help.
    //
    // The Nix dev shell (flake.nix) exports NIX_GAME_LD_LIBRARY_PATH with a
    // reproducible, channel-stable set of libraries. Set it explicitly on the
    // forked game JVM so it applies even through the Gradle daemon. Run the
    // game from `nix develop` (or `nix run`); on other systems this is a
    // no-op and the normal library path is used.
    def nixLibs = System.getenv('NIX_GAME_LD_LIBRARY_PATH')
    if (nixLibs) {
        environment 'LD_LIBRARY_PATH', "${nixLibs}:${System.getenv('LD_LIBRARY_PATH') ?: ''}"
    }
}
